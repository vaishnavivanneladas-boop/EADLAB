<!DOCTYPE html>
<html>
<head>
    <title>Calculator UI</title>

    <style>
        body {
            background-color: #f2f6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 260px;
            padding: 15px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .display {
            grid-column: span 4;
            height: 40px;
            background-color: #e6f0ff;
            text-align: right;
            padding: 8px;
            font-size: 18px;
            border: 1px solid black;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #357abd;
        }
    </style>

</head>
<body>

<div class="calculator">

    <div class="display">0</div>

    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>/</button>

    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>*</button>

    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>-</button>

    <button>0</button>
    <button>.</button>
    <button>=</button>
    <button>+</button>

</div>

</body>
</html>
