<!DOCTYPE html>
<html>
<head>

<style>

/* Navigation Bar */

ul{
    list-style-type: none;
    margin: 0;
    padding: 0;
    background-color: #333;
    overflow: hidden;
}

li{
    float: left;
    position: relative;
}

li a{
    display: block;
    padding: 12px 16px;
    color: white;
    text-decoration: none;
}

/* Hover Effect */

li a:hover{
    background-color: #555;
}

/* Dropdown */

.dropdown{
    display: none;
    position: absolute;
    background-color: #444;
    min-width: 150px;
    z-index: 1;
}

/* Dropdown Links */

.dropdown a{
    display: block;
    padding: 10px;
    color: white;
}

/* Show Dropdown */

li:hover .dropdown{
    display: block;
}

</style>

</head>

<body>

<ul>

<li><a href="#">Home</a></li>

<li><a href="#">About</a></li>

<li>

<a href="#">Services</a>

<div class="dropdown">
    <a href="#">Web Design</a>
    <a href="#">App Development</a>
</div>

</li>

<li><a href="#">Contact</a></li>

</ul>

</body>
</html>
