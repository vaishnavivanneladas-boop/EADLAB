<!DOCTYPE html>
<html>
<head>
<style>

.calculator{
    width: 260px;
    background-color: lightgray;
    padding: 20px;
}

input{
    width: 220px;
    height: 40px;
    margin-bottom: 10px;
}

button{
    width: 50px;
    height: 50px;
    margin: 5px;
    font-size: 18px;
}

</style>
</head>

<body>

<div class="calculator">

<input type="text"><br>

<button>1</button>
<button>2</button>
<button>3</button>
<button>+</button><br>

<button>4</button>
<button>5</button>
<button>6</button>
<button>-</button><br>

<button>7</button>
<button>8</button>
<button>9</button>
<button>*</button><br>

<button>0</button>
<button>=</button>
<button>/</button>
<button>←</button>

</div>

</body>
</html>
