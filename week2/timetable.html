<!DOCTYPE html>
<html>
<head>
<style>
table{
    width: 50%;
    border-collapse: collapse;
}

th{
    background-color: purple;
    color: white;
}

th,td{
    border: 1px solid black;
    padding: 10px;
    text-align: center;
}
</style>
</head>

<body>

<h2>Timetable</h2>

<table>
<tr>
    <th>Day</th>
    <th>Subject</th>
</tr>

<tr>
    <td>Monday</td>
    <td>Maths</td>
</tr>

<tr>
    <td>Tuesday</td>
    <td>Science</td>
</tr>

</table>

</body>
</html>
